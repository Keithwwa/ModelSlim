site_name: msModelSlim Documentation
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

repo_url: https://gitcode.com/keith_wa/msmodelslim
edit_uri: edit/master/docs/zh/

