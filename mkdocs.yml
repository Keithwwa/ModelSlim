      - ONNX PTQ: "zh/python_api/quantization_apis/[onnx]post_training_quantization/OnnxCalibrator.md"
      - MindSpore PTQ: "zh/python_api/quantization_apis/[mindspore]post_training_quantization/quantize_model.md"
